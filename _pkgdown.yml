url: https://simxnherrera.github.io/ellmercodex/

destination: _site

template:
  bootstrap: 5
  bslib:
    primary: "#447099"
    base_font: {google: {family: "Source Sans Pro", wght: [400, 600], ital: [0, 1]}}
    code_font: {google: "Source Code Pro"}
    font_scale: 1.2
    fg: "#172431"
    bg: "#fcfcfc"
    border-radius: 0
    btn-border-radius: 3px
    grid-gutter-width: 3rem
    pkgdown-nav-height: 78px

code:
  width: 71

navbar:
  type: light
  bg: none
  structure:
    left: [intro, reference, articles, espanol, news]
    right: [search, github, lightswitch]
  components:
    espanol:
      text: Español
      menu:
      - text: Primeros pasos
        href: articles/ellmercodex-es.html
      - text: Inicio de sesión y credenciales
        href: articles/authentication-es.html
      - text: Modelos y esfuerzo de razonamiento
        href: articles/models-es.html
      - text: Análisis de texto
        href: articles/text-analysis-es.html
      - text: Errores y límites
        href: articles/errors-and-limits-es.html

reference:
- title: Chat
  desc: >
    Create an `ellmer` `Chat` backed by your ChatGPT plan, then use its usual
    methods to send messages, stream responses, call tools, and extract
    structured data.
  contents:
  - chat_codex
  - codex_models
- title: Authentication
  desc: >
    Sign in with ChatGPT in the browser, inspect the stored credential, and
    sign out.
  contents:
  - codex_login
  - codex_logout
  - codex_account
- title: Diagnostics and errors
  contents:
  - codex_available
  - ellmercodex-conditions
- title: Package
  contents:
  - ellmercodex

articles:
- title: Articles
  navbar: ~
  contents:
  - authentication
  - models
  - text-analysis
  - errors-and-limits
- title: En español
  desc: Los mismos artículos, en español.
  contents:
  - ellmercodex-es
  - authentication-es
  - models-es
  - text-analysis-es
  - errors-and-limits-es
