name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ellmer: [minimum, latest]
    env:
      # The package's test suite is fixture-only.  Keep this explicit so a
      # future opt-in test cannot accidentally turn CI into an OAuth client.
      ELLMERCODEX_SKIP_LIVE_TESTS: "true"
      _R_CHECK_FORCE_SUGGESTS_: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: any::rcmdcheck
      - name: Install minimum supported ellmer
        if: matrix.ellmer == 'minimum'
        run: |
          Rscript -e 'if (packageVersion("ellmer") != package_version("0.5.0")) install.packages("https://cran.r-project.org/src/contrib/Archive/ellmer/ellmer_0.5.0.tar.gz", repos = NULL, type = "source")'
      - name: Show ellmer version
        run: Rscript -e 'cat(as.character(packageVersion("ellmer")), "\n")'
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
